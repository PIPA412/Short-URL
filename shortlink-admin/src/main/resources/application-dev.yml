# ===================================================================
# Development Environment Configuration
# ===================================================================
spring:
  # MySQL DataSource
  datasource:
    url: jdbc:mysql://localhost:3306/short_link?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# ===================================================================
# Logging (Development)
# ===================================================================
logging:
  level:
    root: INFO
    com.shortlink: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.security: DEBUG
